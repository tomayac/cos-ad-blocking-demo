<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>COS Ad Blocker</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <h1>COS Ad Blocker</h1>
    <fieldset>
      <legend>Rules</legend>
      <label
        ><input type="checkbox" data-ruleset="block_by_url" /> Block Prebid.js
        by URL</label
      >
      <label
        ><input type="checkbox" data-ruleset="block_by_hash" /> Block Prebid.js
        by its Cross-Origin Storage hash</label
      >
    </fieldset>
    <section>
      <h2>Prebid.js in Cross-Origin Storage</h2>
      <p id="entry">Checking…</p>
      <button type="button" id="remove" hidden>Delete it</button>
    </section>
    <section>
      <h2>Log <button type="button" id="clear">Clear</button></h2>
      <ol id="log"></ol>
    </section>
  </body>
</html>
